<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book4U</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/logos.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <i class="fas fa-book-open"></i>
                <span>Book4U</span>
            </div>
            <!-- Can add later -->
            <!-- <div class="navbar-links">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i>Home
                </a>
            </div> -->
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-box">
                    <h2>Login</h2>
                    <p class="login-subtitle">Welcome back!</p>
                    
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                required
                                placeholder="Enter username"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required
                                placeholder="Enter password"
                            >
                        </div>

                        <div id="errorMessage" class="error-message"></div>

                        <button type="submit" class="btn-submit" id="loginBtn">
                            Login
                        </button>
                    </form>

                    <div class="demo-info">
                        <h4><i class="fa-solid fa-lightbulb"></i>Demo account:</h4>
                        <p><strong>Username:</strong> john.doe</p>
                        <p><strong>Password:</strong> john123</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/login.js"></script>
</body>
</html>
