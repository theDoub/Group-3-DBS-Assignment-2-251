<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - Book4U</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/orders-admin.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-3 sticky-top" style="background-color: var(--primary);">
    <div class="container py-1">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
            <i class="bi bi-book-half me-2 fs-4"></i>
            <span>Book4U</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            

            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link" href="categories.html"><i class="bi bi-list-check me-1"></i>Categories</a>
                    </li>

                    <li class="nav-item active">
                            <a class="nav-link" href="authors.html"><i class="bi bi-person-lines-fill me-1"></i>Authors</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link" href="publishers.html"><i class="bi bi-buildings me-1"></i>Publishers</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link active" href="orders-admin.html"><i class="bi bi-receipt me-1"></i>Orders</a>
                    </li>
                    
                    <li class="nav-item">
                            <a class="nav-link" href="cart.html"><i class="bi bi-cart-fill me-1"></i> Cart</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link" href="reviews-admin.html"><i class="bi bi-star-fill me-1"></i> Reviews</a>
                    </li>
                
                <li class="nav-item">
                    <div class="nav-link" class="btn btn-light btn-sm fw-semibold px-3" data-bs-toggle="modal" data-bs-target="#paymentModal">
                        <i class="bi bi-credit-card me-1"></i> Payment
                    </div>
                </li>


                <li class="nav-item">
                    <div class="nav-link" class="btn btn-light btn-sm fw-semibold px-3" data-bs-toggle="modal" data-bs-target="#deliveryModal">
                        <i class="bi bi-truck me-1"></i> Delivery
                    </div>
                </li>
                

                <!-- Welcome User and Logout -->
                <li class="nav-item">
                        <span class="nav-link active" id="welcomeUser"></span>
                    </li>

                <li class="nav-item">
                    <button onclick="logout()" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <!-- Admin Orders Section -->
    <div class="container-lg mt-5">
        <!-- HERO SECTION -->
        <section class="hero-banner rounded-4 p-4 mb-4 shadow-sm d-flex flex-column flex-md-row align-items-md-center justify-content-between">
            <div class="position-relative" style="z-index:1;">
                <h2 class="fw-bold mb-2">
                    <i class="bi bi-receipt me-2"></i>Managing Orders
                </h2>
                <p class="mb-3 hero-stats">
                    Oversee and manage all customer orders efficiently.
                </p>
            </div>
        </section>


        <!-- Filter Section -->
        <div class="row mb-4">
            <div class="col-md-3">
                <label class="form-label fw-bold">Filter by Status</label>
                <select id="statusFilter" class="form-select" onchange="filterOrdersByStatus()">
                    <option value="">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Search Customer</label>
                <input type="text" id="searchCustomer" class="form-control" placeholder="Search by name..." onkeyup="searchCustomers()">
            </div>
        </div>

        <!-- Orders Grid -->
        <div class="row" id="ordersAdminContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Order Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="orderDetailsContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Management Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(125deg, var(--primary) 50%, var(--primary-gradient) 100%); color: white; border: none;">
                    <h5 class="modal-title"><i class="bi bi-credit-card me-2"></i>Payment Management</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="paymentManagementContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delivery Management Modal -->
    <div class="modal fade" id="deliveryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(125deg, var(--primary) 50%, var(--primary-gradient) 100%); color: white; border: none;">
                    <h5 class="modal-title"><i class="bi bi-truck me-2"></i>Delivery Management</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="deliveryManagementContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/orders-admin.js"></script>
</body>
</html>
