<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book4U - Order Detail</title>
<style>
    body { font-family: Arial; background: #f1f5f9; padding: 20px; }
    .header {
        background: #007bff;
        padding: 15px;
        color: white;
        font-size: 20px;
        text-align: center;
        border-radius: 10px;
        margin-bottom: 25px;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        margin: auto;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }
    button {
        background: #007bff;
        padding: 12px;
        width: 100%;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    .result, .error {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        display: none;
    }
    .result { background: #eaffea; color: #0f7c09; }
    .error { background: #ffe5e5; color: #b30000; }


    /*  */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }
    th {
        background: #007bff;
        color: white;
        font-weight: bold;
    }
    tr:hover {
        background: #f5f5f5;
    }

/*  */
    .order-info {
        background: #e7f3ff;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-left: 4px solid #007bff
    }

    .order-info p {
        margin: 8px 0;
        font-size: 16px;
    }

    .discount-btn {
        background: #28a745;
        padding: 8px 12px;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .discount-btn:hover {
        background: #218838;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 20px;
        background: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .back-btn:hover {
        background: #5a6268;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 10px;
        width: 700px;
        max-width: 90%;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .modal-header {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #007bff;
    }

    .close-modal {
        float: right;
        font-size: 28px;
        font: optional;
        cursor: pointer;
        color: #aaa;
    }

    .close-modal:hover {
        color: black;
    }
    .discount-list {
        max-height: 400px;
        overflow-y: auto;
    }

    .discount-item {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 10px;
        background: #f9f9f9;
    }
    .discount-item p {
        margin: 5px 0;
        font-size: 14px;
    }
    .discount-item-btn {
        background: #007bff;
        color: white;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }
    .discount-item-btn:hover {
        background: #0056b3;
    }
    /* Order List */
    .orders-list-container {
        padding: 25px;
    }
    .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }
    .order-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .order-card h3 {
        margin: 0 0 10px 0;
        color: #007bff;
    }
    .order-card p {
        margin: 8px 0;
        color: #666;
    }
     .see-details-btn {
        background: #007bff;
        padding: 10px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
    }
    .see-details-btn:hover {
        background: #0056b3;
    }

</style>
</head>
<body>

    <!-- For Customer Details -->
<div class="header" id="pageHeader"></div>

<!-- Orders List Section (NEW) -->
<div id="ordersList" class="orders-list-container">
    <div class="header">My Orders</div>
    <div id="ordersContainer" class="orders-grid"></div>
</div>

<div id="orderDetails" class="container" style="display:none;">
    
    <button class="back-btn" onclick="backToOrdersList()">Back to Orders List</button>

    <div class="order-info">
        <p><b>Order ID:</b> <span id="displayOrderId">-</span></p>
        <p><b>Order Date:</b> <span id="displayOrderDate">-</span></p>
        <p><b>Status:</b> <span id="displayStatus">-</span></p>
        <p><b>Total Amount:</b> $<span id="displayTotal">-</span></p>
    </div>

    <h3>Order Items</h3>
    <table>
        <thread>
            <tr>
                <th>Order No</th>
                <th>Book Title</th>
                <th>Format Type</th>
                <th>Quantity</th>
                <th>Price Per Item</th>
                <th>Price At Purchase</th>
                <th>Applied Discount</th>
            </tr>
        </thread>
        <tbody id="itemsTable">
            <!-- Order items will be populated here -->
            <tr><td colspan="6">Loading...</td></tr>
        </tbody>
    </table>

    <div id="result" class="result"></div>
    <div id="error" class="error"></div>


</div>

<!-- Discount Modal -->
<div id="discountModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeDiscountModal()">&times;</span>
        <div class="modal-header">Select a Discount</div>
        <div class="discount-list" id="discountList">
            <p style="text-align:center;">Loading discounts...</p>
        </div>
    </div>
</div>

<script>
let currentOrderNo = null;  // Store which item is being discounted
let currentOrderId = null;
const user = JSON.parse(localStorage.getItem("user"));
// If not logged in, redirect to login page
if (!user || !user.accountID) {
    alert("Please log in");
    window.location.href = "login.html";
}
const accountId = user.accountID; // Extract accountId from user object

// Initialize
loadCustomerName();
loadOrdersList();

function loadCustomerName() {
    document.getElementById("pageHeader").innerText = `Customer: ${user.username}`;
}

function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

function showMessage(msg, type){
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    if(type === "success"){
        error.style.display = "none";
        result.style.display = "block";
        result.innerHTML = msg;
    } else {
        result.style.display = "none";
        error.style.display = "block";
        error.innerHTML = msg;
    }
}
//
function backToOrdersList() {
    window.location.href = `order.html?accountId=${accountId}`;
}

function loadOrdersList() {
    const orderId = new URLSearchParams(window.location.search).get('orderId');
        
        if (!orderId) {
            // Show orders list
            fetch(`http://127.0.0.1:5000/api/orders?accountId=${accountId}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('ordersContainer');
                    container.innerHTML = '';
                    console.log("--DEBUG Orders List API Response:", JSON.stringify(data, null, 2));
                    data.forEach(order => {
                        container.innerHTML += `
                            <div class="order-card">
                                <h3>Order ${order.OrderID}</h3>
                                <p><b>Date:</b> ${order.OrderDate}</p>
                                <p><b>Total:</b> $${order.TotalAmount}</p>
                                <p><b>Status:</b> ${order.Status}</p>
                                <button class="see-details-btn" onclick="viewOrderDetails('${order.OrderID}')">See Details</button>
                            </div>
                        `;
                    });
                });
        } else {
            // Hide orders list, show order details
            document.getElementById('ordersList').style.display = 'none';
            document.getElementById('orderDetails').style.display = 'block';
            loadOrder();
        }
}
function viewOrderDetails(orderId) {
        currentOrderId = orderId;
        document.getElementById('ordersList').style.display = 'none';
        document.getElementById('orderDetails').style.display = 'block';
        window.location.href = `order.html?orderId=${orderId}`;
        loadOrder();
}



// Discount Modal
function openDiscountModal(orderNo) {
    currentOrderNo = orderNo;
    document.getElementById("discountModal").style.display = "block";
    loadAvailableDiscounts();
}

function closeDiscountModal() {
    document.getElementById("discountModal").style.display = "none";
    currentOrderNo = null;
}
function loadAvailableDiscounts() {
    fetch("http://127.0.0.1:5000/api/orders/discounts")  // ← Fetch all discounts
        .then(res => res.json())
        .then(discounts => {
            const discountList = document.getElementById("discountList");
            
            if (!discounts || discounts.length === 0) {
                discountList.innerHTML = '<p style="text-align:center; color: red;">No discounts available</p>';
                return;
            }

            let html = '';
            discounts.forEach(discount => {
                html += `
                    <div class="discount-item">
                        ${discount.Conditions ? `<h3 style="margin: 0 0 10px 0">${discount.Conditions}</h3>` : ''}
                        ${discount.Name ? `<h4 style="margin: 0 0 10px 0">${discount.Name}</h4>` : ''}
                        
                        <p><b>Discount ID:</b> ${discount.DiscountID}</p>
                        <p><b>Type:</b> ${discount.Type}</p>
                        <p><b>Value:</b> ${discount.Value}${discount.Type === 'percentage' ? '%' : '$'}</p>
                        <button class="discount-item-btn" onclick="applyDiscountToItem('${discount.DiscountID}')">
                            Apply
                        </button>
                    </div>
                       `;

            // E.g. what a discount looks like
            // 50% off, max $20 <- Headline, to catch attention
            // BLACKFRIDAY <- Name of discount
            // Discount ID: 3
            // Type: percentage
            // Value: 50.00%
            // If name and conditions exist, show them, else skip
            });
            discountList.innerHTML = html;
        })
        .catch(err => {
            document.getElementById("discountList").innerHTML = '<p style="color: red;">Error loading discounts</p>';
        });
}

function applyDiscountToItem(discountId) {
    const orderId = currentOrderId;
    const orderNo = currentOrderNo;

    fetch(`http://127.0.0.1:5000/api/orders/${orderId}/apply-discount`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
            discountID: discountId, 
            orderNo: orderNo,
            orderID: orderId
        })
    })
    .then(res => res.json().then(body => ({ status: res.status, body })))
    .then(r => {
        if (r.status === 200) {
            closeDiscountModal();
            showMessage(
                `<b>✓ ${r.body.message}</b><br>`,
                "success"
            );
            loadOrder();  // Reload to show updated prices
        } else {
            showMessage("<b>Error:</b> " + (r.body.message || r.body.error), "error");
        }
    });
}

function deleteDiscount(orderNo, discountId) {
    const orderId = currentOrderId;
    
    if (!confirm("Are you sure you want to remove the discount?")) return;

    fetch(`http://127.0.0.1:5000/api/orders/${orderId}/delete-discount`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
            discountID: discountId,
            orderNo: orderNo,
            orderID: orderId
        })
    })
    .then(res => res.json().then(body => ({ status: res.status, body })))
    .then(r => {
        if (r.status === 200) {
            showMessage(
                `<b>✓ ${r.body.message}</b><br>`,
                "success"
            );
            loadOrder();  // Reload to show updated prices
        } else {
            showMessage("<b>Error:</b> " + (r.body.message || r.body.error), "error");
        }
    });
}

function deleteDiscountPrompt(orderNo, appliedDiscounts) {
    const discountList = appliedDiscounts.split(',').map(d => d.trim());
    const discountId = prompt(`Applied discounts: ${appliedDiscounts}\n\nEnter Discount ID to remove:`, "");
    
    if (!discountId) return;
    
    // Validate if entered discount is in the applied list
    if (!discountList.includes(discountId)) {
        showMessage("<b>Error:</b> This discount is not applied to this item", "error");
        return;
    }
    
    deleteDiscount(orderNo, discountId);
}

function loadOrder() {
    const orderId = getQueryParam("orderId");
    currentOrderId = orderId;
    console.log("...Loading orderId:", orderId);

    if (!orderId) {
        showMessage("No orderId specified in URL.", "error");
        return;
    }

    fetch(`http://127.0.0.1:5000/api/orders/${orderId}`)
        .then(res => res.json())
        .then(order => {
            // Display order info
            document.getElementById("displayOrderId").textContent = order.OrderID;
            document.getElementById("displayOrderDate").textContent = order.OrderDate;
            document.getElementById("displayStatus").textContent = order.Status;
            document.getElementById("displayTotal").textContent = order.TotalAmount;

            // Display items with discount button
            const itemsHtml = order.items.map(item => {
                const appliedDiscount = item.AppliedDiscounts && item.AppliedDiscounts.trim().length > 0
                    ? item.AppliedDiscounts
                    : '<span style="color: gray;">None</span>';
                return `
                <tr>
                    <td>${item.OrderNo}</td>
                    <td>${item.BookTitle}</td>
                    <td>${item.FormatType}-${item.FormatID}</td>
                    <td>${item.Quantity}</td>
                    <td>$${item.PricePerItem}</td>
                    <td>$${item.PriceAtPurchase}</td>
                    <td>${appliedDiscount}</td>
                    <td>
                        <button class="discount-btn" onclick="openDiscountModal(${item.OrderNo})">
                            Apply Discount
                        </button>
                        ${item.AppliedDiscounts && item.AppliedDiscounts.trim().length > 0 
                            ? `<button class="delete-discount-btn" onclick="deleteDiscountPrompt(${item.OrderNo}, '${item.AppliedDiscounts}')">Delete Discount</button>` 
                            : ''}
                    </td>
                </tr>
            `;}
        ).join('');

            document.getElementById("itemsTable").innerHTML = itemsHtml;
        })
        .catch(err => {
            showMessage("Error loading order: " + err.message, "error");
        });
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById("discountModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
