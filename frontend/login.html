<script>
    function login() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        
        // Show loading
        Swal.fire({ title: 'Logging in...', didOpen: () => Swal.showLoading() });

        fetch("http://127.0.0.1:5000/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        })
        .then(res => res.json().then(data => ({ status: res.status, body: data })))
        .then(r => {
            if (r.status === 200) {
                localStorage.setItem("user", JSON.stringify(r.body));
                Swal.fire({ icon: 'success', title: 'Success', text: 'Redirecting...', timer: 1000, showConfirmButton: false })
                .then(() => window.location.href = "home.html");
            } else {
                Swal.fire({ icon: 'error', title: 'Login Failed', text: r.body.error || r.body.message });
            }
        })
        .catch(err => Swal.fire({ icon: 'error', title: 'Connection Error', text: 'Is the backend running?' }));
    }
</script>
