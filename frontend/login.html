<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book4U Login</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .login-container {
        width: 360px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        color: #007bff;
        margin-bottom: 20px;
    }
    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }
    button {
        background: #007bff;
        color: white;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background: #005dc1;
    }
    .msg {
        margin-top: 15px;
        padding: 12px;
        border-radius: 6px;
        display: none;
    }
    .error {
        background: #ffe5e5; color: #a10000;
    }
</style>
</head>
<body>

<div class="login-container">
    <h2>Book4U Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div id="errorBox" class="msg error"></div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const err = document.getElementById("errorBox");

    err.style.display = "none";

    fetch("http://127.0.0.1:5000/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
    })
    .then(res => res.json().then(data => ({ status: res.status, body: data })))
    .then(r => {
        if (r.status === 200) {
            localStorage.setItem("user", JSON.stringify(r.body));
            window.location.href = "home.html";
        } else {
            err.style.display = "block";
            err.innerHTML = r.body.error || r.body.message;
        }
    })
}
</script>

</body>
</html>
