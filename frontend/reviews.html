<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - Book4U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/reviews.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-3 sticky-top" style="background-color: var(--primary);">
    <div class="container py-1">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <i class="bi bi-book-half me-2 fs-4"></i>
            <span>Book4U</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="authors.html"><i class="bi bi-person-lines-fill me-1"></i>Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="orders.html"><i class="bi bi-receipt me-1"></i>Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="reviews.html"><i class="bi bi-star-fill me-1"></i>Reviews</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="cart.html"><i class="bi bi-cart-fill me-1"></i>Cart</a>
                </li>
                <li class="nav-item">
                    <span class="nav-link active" id="welcomeUser"></span>
                </li>
                <li class="nav-item">
                    <button onclick="logout()" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 1100px;">
    <!-- HERO BANNER -->
    <section class="hero-banner rounded-4 p-4 mb-4 shadow-sm">
        <div class="position-relative" style="z-index:1;">
            <h2 class="fw-bold mb-2 text-white">
                <i class="bi bi-star-fill me-2"></i>Write Reviews
            </h2>
            <p class="mb-0 text-white-50">
                Share your thoughts about books you've purchased and help other readers discover great reads!
            </p>
        </div>
    </section>

    <!-- Confirmed Orders Section -->
    <div id="confirmedOrdersSection">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0"><i class="bi bi-check-circle me-2"></i>Your Confirmed Orders</h5>
            <button class="btn btn-outline-primary btn-sm" onclick="loadConfirmedOrders()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>
        <div id="confirmedOrdersContainer" class="row g-4"></div>
    </div>


    <!-- USER'S REVIEWS SECTION -->
    <div id="userReviewsSection" class="mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0"><i class="bi bi-star me-2"></i>Your Reviews</h5>
            <button class="btn btn-outline-primary btn-sm" onclick="loadUserReviews()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>
        <div id="userReviewsContainer" class="row g-4"></div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header" style="background: linear-gradient(125deg, var(--primary) 50%, var(--primary-gradient) 100%); color: white; border: none;">
                <h5 class="modal-title fw-bold"><i class="bi bi-star-fill me-2"></i>Write a Review</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Book Title</label>
                    <input type="text" class="form-control" id="reviewBookTitle" disabled>
                    <input type="hidden" id="reviewBookId">
                    <input type="hidden" id="reviewOrderId">
                    <input type="hidden" id="reviewOrderItemId">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Rating *</label>
                    <div class="rating-stars d-flex gap-2">
                        <i class="bi bi-star-fill star" data-rating="1" style="font-size: 2.5rem; cursor: pointer; color: #ddd; transition: color 0.2s;"></i>
                        <i class="bi bi-star-fill star" data-rating="2" style="font-size: 2.5rem; cursor: pointer; color: #ddd; transition: color 0.2s;"></i>
                        <i class="bi bi-star-fill star" data-rating="3" style="font-size: 2.5rem; cursor: pointer; color: #ddd; transition: color 0.2s;"></i>
                        <i class="bi bi-star-fill star" data-rating="4" style="font-size: 2.5rem; cursor: pointer; color: #ddd; transition: color 0.2s;"></i>
                        <i class="bi bi-star-fill star" data-rating="5" style="font-size: 2.5rem; cursor: pointer; color: #ddd; transition: color 0.2s;"></i>
                    </div>
                    <small class="text-muted d-block mt-2">You selected: <span id="ratingDisplay">0</span> stars</small>
                    <input type="hidden" id="reviewRating" value="0">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Your Comment *</label>
                    <textarea class="form-control" id="reviewComment" rows="5" placeholder="Share your detailed thoughts about this book..."></textarea>
                    <small class="text-muted d-block mt-1">Minimum 10 characters</small>
                </div>

                <button class="btn btn-primary w-100" onclick="submitReview()">
                    <i class="bi bi-check-circle me-1"></i>Submit Review
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="scripts/reviews.js"></script>
</body>
</html>
