<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Book4U</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/cart.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <div class="logo">📚 Book4U</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#books">Books</a></li>
                    <li><a href="orders.html">📦 Orders</a></li>
                    <li><a href="cart.html" class="active">🛒 Cart</a></li>
                    <li id="authSection">
                        <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h1 class="page-title">🛒 Your Shopping Cart</h1>
            
            <div id="loading">Loading cart...</div>
            
            <div id="emptyCart" style="display: none;">
                <div class="empty-cart">
                    <p>Your cart is empty</p>
                    <button class="btn-primary" onclick="window.location.href='index.html#books'">
                        Continue Shopping
                    </button>
                </div>
            </div>
            
            <div id="cartContent" style="display: none;">
                <div class="cart-layout">
                    <!-- Cart Items -->
                    <div class="cart-items">
                        <div id="cartItemsList"></div>
                    </div>
                    
                    <!-- Cart Summary -->
                    <div class="cart-summary">
                        <h3>Order Summary</h3>
                        
                        <div class="voucher-section">
                            <h4>Discount Code</h4>
                            <div class="voucher-input-group">
                                <input type="text" id="voucherCode" placeholder="Enter discount code">
                                <button class="btn-apply-voucher" onclick="applyVoucher()">Apply</button>
                            </div>
                            <div id="voucherMessage"></div>
                            <div id="appliedVouchers"></div>
                        </div>
                        
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">0đ</span>
                        </div>
                        <div class="summary-row discount-row" id="discountRow" style="display: none;">
                            <span>Discount:</span>
                            <span id="discountAmount" class="discount-text">-0đ</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total:</span>
                            <span id="totalAmount" class="total-price">0đ</span>
                        </div>
                        
                        <div class="delivery-address-section">
                            <h4>Delivery Address</h4>
                            <textarea id="deliveryAddress" placeholder="Enter your delivery address..." rows="3"></textarea>
                        </div>
                        
                        <button class="btn-checkout" onclick="proceedToCheckout()">
                            Proceed to Checkout
                        </button>
                        
                        <button class="btn-continue-shopping" onclick="window.location.href='index.html#books'">
                            ← Continue Shopping
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/cart.js"></script>
</body>
</html>
