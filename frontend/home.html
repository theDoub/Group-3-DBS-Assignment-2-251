<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book4U - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .book-card { transition: transform 0.3s ease, box-shadow 0.3s ease; border: none; border-radius: 12px; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .format-badge { transition: 0.2s; }
        .format-badge:hover { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-book-half me-2"></i>Book4U</a>
        <div class="d-flex gap-2">
            <span class="navbar-text text-light me-3" id="welcomeUser"></span>
            <a href="order.html" class="btn btn-outline-light btn-sm"><i class="bi bi-receipt"></i> Orders</a>
            <a href="cart.html" class="btn btn-light btn-sm text-primary fw-bold"><i class="bi bi-cart-fill"></i> Cart</a>
            <button onclick="logout()" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-secondary"><i class="bi bi-stars text-warning"></i> Featured Books</h2>
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    
    <div id="books" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) window.location.href = "login.html";
    document.getElementById("welcomeUser").innerText = `Hi, ${user.username}`;

    function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
    }

    function loadBooks() {
        fetch("http://127.0.0.1:5000/api/books")
            .then(res => res.json())
            .then(data => {
                document.getElementById("loading").style.display = "none";
                const container = document.getElementById("books");
                container.innerHTML = "";

                data.forEach(b => {
                    let formatsHtml = '<div class="mt-3"><small class="text-muted d-block mb-1">Select Format:</small>';
                    
                    if (b.Formats) {
                        const formats = typeof b.Formats === 'string' ? JSON.parse(b.Formats) : b.Formats;
                        
                        if (Array.isArray(formats)) {
                            // 1. Sắp xếp giá tăng dần
                            formats.sort((x, y) => x.Price - y.Price);
                            
                            // 2. Fix lỗi dấu nháy đơn ' (Harry Potter's)
                            const safeTitle = b.Title.replace(/'/g, "\\'"); 

                            formatsHtml += formats.map(f => `
                                <button onclick="buy('${f.FormatID}', '${safeTitle}', '${f.FormatType}')" 
                                    class="btn btn-outline-primary btn-sm mb-2 w-100 text-start format-badge">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span><i class="bi bi-cart-plus"></i> ${f.FormatType}</span>
                                        <span class="fw-bold text-dark">$${f.Price}</span>
                                    </div>
                                </button>
                            `).join('');
                        }
                    }
                    formatsHtml += '</div>';

                    // Mock Image
                    const randomColor = Math.floor(Math.random()*16777215).toString(16);
                    const imgUrl = `https://via.placeholder.com/300x200/${randomColor}/ffffff?text=${encodeURIComponent(b.Title)}`;

                    container.innerHTML += `
                        <div class="col">
                            <div class="card h-100 book-card shadow-sm">
                                <img src="${imgUrl}" class="card-img-top" alt="${b.Title}" style="height: 200px; object-fit: cover;">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title text-primary fw-bold text-truncate" title="${b.Title}">${b.Title}</h5>
                                    
                                    <div class="mb-2">
                                        <span class="badge bg-secondary opacity-75">${b.Categories || 'General'}</span>
                                    </div>
                                    
                                    <p class="card-text text-muted small flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                                        ${b.Description || 'No description available.'}
                                    </p>
                                    
                                    <div class="mt-auto border-top pt-2">
                                        ${formatsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    }

    function buy(formatId, title, type) {
        Swal.fire({
            title: `Add to Cart`,
            html: `Book: <b>${title}</b><br>Format: <span class="badge bg-info text-dark">${type}</span>`,
            input: 'number',
            inputValue: 1,
            inputLabel: 'Quantity',
            inputAttributes: { min: 1, max: 100, step: 1 },
            showCancelButton: true,
            confirmButtonText: '<i class="bi bi-cart-check"></i> Add Now',
            confirmButtonColor: '#0d6efd',
        }).then((result) => {
            if (result.isConfirmed) {
                const qty = parseInt(result.value);
                if (qty > 0) {
                    fetch('http://127.0.0.1:5000/api/cart', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ accountId: user.accountID, formatId: formatId, quantity: qty })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.error) {
                            Swal.fire('Error', data.error, 'error');
                        } else {
                            const Toast = Swal.mixin({
                                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
                            });
                            Toast.fire({ icon: 'success', title: 'Added to cart successfully' });
                        }
                    })
                    .catch(err => Swal.fire('Error', 'Failed to connect server', 'error'));
                }
            }
        });
    }

    loadBooks();
</script>
</body>
</html>
