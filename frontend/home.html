<!DOCTYPE html>

<meta charset="UTF-8">
<title>Book4U - Home</title>
<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #f1f5f9;
    }
    .header {
        background: #007bff;
        padding: 15px;
        color: white;
        font-size: 22px;
        text-align: center;
    }
    .book-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 25px;
    }
    .card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
    }
    .btn {
        background: #007bff;
        padding: 10px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        width: 100%;
    }
</style>
</head>
<body>

<div class="header">Book4U Store</div>

<button class="see-orders-btn" onclick="goToOrders()">See My Orders</button>
<button class="see-cart-btn" onclick="goToCart()">Go to My Cart</button>
<div id="books" class="book-list"></div>

<script>
let currentOrderID = null;

const user = JSON.parse(localStorage.getItem("user"));
// If not logged in, redirect to login page
if (!user || !user.accountID) {
    alert("Please log in");
    window.location.href = "login.html";
}
const accountId = user.accountID; // Extract accountId from user object
console.log("Logged in with current user accountId:", accountId);

function goToOrders() {
    window.location.href = "order.html";
}
function goToCart() {
    window.location.href = "cart.html";
}

function loadBooks() {
    fetch("http://127.0.0.1:5000/api/books")
        .then(res => res.json())
        .then(data => {
            console.log("Full API Response:", JSON.stringify(data, null, 2));

            const container = document.getElementById("books");
            container.innerHTML = "";

            data.forEach(b => {
                let formatsHtml = '';
                if (b.Formats) {
                    const formats = typeof b.Formats === 'string' ? JSON.parse(b.Formats) : b.Formats;
                    if (Array.isArray(formats)) {
                        formatsHtml = formats.map(f => `
                            <div style="margin: 8px 0; padding: 8px; background: #f0f0f0; border-radius: 4px;">
                                <p style="margin: 4px 0;"><b>${f.FormatType}</b> (ID: ${f.FormatID})</p>
                                <button class="btn" onclick="buy('${f.FormatID}')" style="width: 100%; padding: 8px;">Buy</button>
                            </div>
                        `).join('');
                    }
                }

                container.innerHTML += `
                    <div class="card">
                        <h3>${b.Title}</h3>
                        <p><b>Categories:</b> ${b.Categories}</p>
                        <p><b>Price:</b> $${b.MinPrice}</p>
                        ${formatsHtml}
                    </div>
                `;
            });
        });
}

function buy(formatId) {
    const quantity = prompt("Enter quantity:", "1");
    if (!quantity || isNaN(quantity) || quantity < 1) return;

    fetch('http://127.0.0.1:5000/api/cart', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accountId, formatId, quantity })
    })
    .then(res => res.json())
    .then(data => alert('Item added to cart!'));
}
