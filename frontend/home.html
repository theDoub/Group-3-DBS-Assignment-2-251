<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book4U - Home</title>
<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #f1f5f9;
    }
    .header {
        background: #007bff;
        padding: 15px;
        color: white;
        font-size: 22px;
        text-align: center;
    }
    .book-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 25px;
    }
    .card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
    }
    .btn {
        background: #007bff;
        padding: 10px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        width: 100%;
    }
</style>
</head>
<body>

<div class="header">Book4U Store</div>

<div id="books" class="book-list"></div>

<script>
function loadBooks() {
    fetch("http://127.0.0.1:5000/api/books")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("books");
            container.innerHTML = "";

            data.forEach(b => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${b.Title}</h3>
                        <p><b>Price:</b> $${b.MinPrice}</p>
                        <button class="btn" onclick="buy('${b.BookID}')">Mua ngay</button>
                    </div>
                `;
            });
        });
}

function buy(bookId) {
    window.location.href = "order.html?orderId=ORD00001";
}

loadBooks();
</script>

</body>
</html>
