<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publishers - Book4U</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/authors.css"> <!-- Reusing authors.css for publishers -->
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-3 sticky-top" style="background-color: var(--primary);">
    <div class="container py-1">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <i class="bi bi-book-half me-2 fs-4"></i>
            <span>Book4U</span>
        </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link " href="authors.html"><i class="bi bi-person-lines-fill me-1"></i>Authors</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="publishers.html"><i class="bi bi-buildings me-1"></i>Publishers</a>
                    </li>

                    <li class="nav-item">
                            <a class="nav-link" href="orders.html"><i class="bi bi-receipt me-1"></i>Orders</a>
                    </li>
                    
                    <li class="nav-item">
                            <a class="nav-link" href="cart.html"><i class="bi bi-cart-fill me-1"></i> Cart</a>
                    </li>


                    <li class="nav-item">
                        <span class="nav-link active" id="welcomeUser"></span>
                    </li>

                    <li class="nav-item">
                        <button onclick="logout()" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Authors Section -->
    <div class="container-lg my-5">
        <!-- HERO SECTION -->
        <section class="hero-banner rounded-4 p-4 mb-4 shadow-sm d-flex flex-column flex-md-row align-items-md-center justify-content-between">
            <div class="position-relative" style="z-index:1;">
                <h2 class="fw-bold mb-2">
                    <i class="bi bi-buildings me-2"></i>Our Publishers
                </h2>
                <p class="mb-3 hero-stats">
                    Discover amazing publishers and their contributions!
                </p>
            </div>
        </section>

        <!-- Filter Tabs -->
        <div class="mb-4">
            <ul class="nav nav-tabs" id="authorTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="all-authors-tab" data-bs-toggle="tab" data-bs-target="#all-authors" type="button" role="tab">
                        <i class="bi bi-list me-1"></i>All Publishers
                    </button>
                </li>
            </ul>
        </div>

        <!-- Admin Actions -->
        <div class="mb-4" id="adminActionsContainer" style="display: none;">
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-success" 
                        style="background: linear-gradient(125deg, rgba(13,110,253,0.2), rgba(225,46,138,0.2)) !important;
                        color: var(--primary) !important;
                        border: 2px solid var(--primary);" 
                        onclick="openCreatePublisherModal()">

                    <i class="bi bi-plus-circle me-1"></i>Create Publisher
                </button>
                <button class="btn btn-warning" 
                        style="background: linear-gradient(125deg, rgba(32,201,151,0.2), rgba(13,110,253,0.2)) !important;
                        color: #198754 !important;
                        border: 2px solid #198754;"
                        onclick="openEditPublisherModal()">

                    <i class="bi bi-pencil-square me-1"></i>Edit Publisher
                </button>
                <button class="btn btn-danger" 
                        style="background: #f8d7da !important;
                        color: #842029 !important;
                        border: 2px solid #842029;"
                        onclick="deletePublisher()">

                    <i class="bi bi-trash me-1"></i>Delete Publisher
                </button>
            </div>
        </div>

        <!-- Publisher Details Modal -->
        <div class="modal fade" id="authorModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header" style="background: linear-gradient(125deg, var(--primary) 50%, var(--primary-gradient) 100%); color: white; border: none;">
                        <h5 class="modal-title" id="modalTitle"><i class="bi bi-person-circle me-2"></i>Publisher Details</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="authorDetails"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tab Content -->
        <div class="tab-content" id="authorTabContent">
            <!-- All Authors Tab -->
            <div class="tab-pane fade show active" id="all-authors" role="tabpanel">
                <div class="row g-4" id="allAuthorsContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Author Details Modal -->
    <div class="modal fade" id="authorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-circle me-2"></i>Author Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="authorDetails"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/publishers.js"></script>
</body>
</html>
